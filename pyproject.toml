[project]
name = "easyslm"
version = "0.1.0"
description = "A lightweight, generic tool for fine-tuning Small Language Models (SLMs) on classification tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "mlflow>=3.17.2",
    "nvidia-ml-py>=13.615.71",
    "peft>=0.21.2",
    "torch>=2.6.0",
    "transformers>=5.22.1",
]

[project.scripts]
easyslm = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit<4.0.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "models",
    "predictions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, etc.)
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line-length (formatting handles wrapping)
    "B008", # function call in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "normal"
files = ["src"]
