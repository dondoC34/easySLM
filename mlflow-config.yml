server:
  host: "127.0.0.1"
  port: 5000
  # If null, defaults to sqlite:///<EASYSLM_HOME>/mlflow.db (~/.easyslm/mlflow.db)
  backend_store_uri: null
  # If null, defaults to <EASYSLM_HOME>/mlruns (~/.easyslm/mlruns)
  default_artifact_root: null

tracking:
  experiment_prefix: "easySLM"
  autolog_figures: true
  autolog_model: true
  system_metrics: true
  system_metrics_sampling_interval: 10
